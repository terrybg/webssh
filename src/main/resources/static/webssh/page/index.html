<!doctype html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Terry WebSSH</title>
    <link rel="stylesheet" href="../js/bootstrap/bootstrap.min.css"/>
    <link rel="stylesheet" href="../css/index.css"/>
    <link rel="shortcut icon" href="../image/logo.png" />
    <link rel="stylesheet" href="../iconfont/iconfont.css">
    <link rel="stylesheet" href="../font/bootstrap-icons.css">
    <link rel="stylesheet" href="../js/jquery-ui.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            min-width: 800px;
        }
        #appShell {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #212529;
        }
        .remote-tabs {
            flex: 0 0 auto;
            background: #1b1e21;
            padding: 4px 8px 0;
            border-bottom: 1px solid #343a40;
        }
        .remote-tabs .nav-link {
            color: #ced4da;
        }
        .remote-tabs .nav-link.active {
            color: #fff;
            background: #343a40;
            border-color: #343a40 #343a40 transparent;
        }
        .remote-tabs .list-tab .icon-shanchu2 {
            display: none;
        }
        #tabPanes {
            flex: 1 1 auto;
            min-height: 0;
            position: relative;
            background: #212529;
        }
        .shell-tab-pane {
            height: 100%;
            display: none;
        }
        .shell-tab-pane.active.show {
            display: block;
        }
        .shell-tab-pane.remote-pane.active.show {
            display: flex;
            flex-direction: row;
            align-items: stretch;
        }
        .remote-pane .leftDiv {
            flex: 0 0 auto;
            width: 30%;
            min-width: 200px;
            height: 100%;
            overflow: hidden;
        }
        .remote-pane .move-bar {
            flex: 0 0 6px;
            width: 6px;
            height: 100%;
            cursor: col-resize;
            background: #111;
            border-left: 1px solid #333;
            border-right: 1px solid #333;
            position: relative;
            z-index: 5;
        }
        .remote-pane .move-bar:hover,
        body.split-dragging .remote-pane .move-bar {
            background: #0d6efd;
        }
        .remote-pane .rightDiv {
            flex: 1 1 auto;
            min-width: 320px;
            height: 100%;
            overflow: hidden;
        }
        .resizable-iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        /* 拖拽时禁用 iframe 捕获鼠标，避免卡顿/松不开 */
        body.split-dragging {
            cursor: col-resize !important;
            user-select: none !important;
        }
        body.split-dragging iframe {
            pointer-events: none !important;
        }
        #sessionListView {
            height: 100%;
            overflow: auto;
            color: #fff;
        }
        #sessionListView .session-list-toolbar {
            padding: 12px 20px 0;
        }
        #sessionListView .session-list-toolbar .btn {
            margin-right: 8px;
        }
        #sessionListView .session-list-body {
            padding: 12px 20px 24px;
        }
        #sessionEmptyState {
            padding: 48px 16px;
            text-align: center;
            color: #adb5bd;
        }
        #sessionTable .session-actions .btn {
            margin: 2px 2px;
        }
        #sessionTable tbody tr {
            cursor: default;
        }
        #sessionContextMenu {
            display: none;
            position: fixed;
            z-index: 3000;
            min-width: 140px;
            background: #2b3035;
            border: 1px solid #495057;
            border-radius: 4px;
            box-shadow: 0 4px 12px rgba(0,0,0,.45);
            padding: 4px 0;
        }
        #sessionContextMenu .ctx-item {
            display: block;
            padding: 8px 16px;
            color: #f8f9fa;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }
        #sessionContextMenu .ctx-item:hover {
            background: #0d6efd;
            color: #fff;
        }
        #loadingIndicator {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            text-align: center;
            padding-top: 40vh;
        }
        #commandModal .command-value {
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 0.875rem;
        }
        #commandModal .command-actions .btn {
            margin: 2px 2px;
        }
        #commandEmptyState {
            padding: 16px 8px;
            text-align: center;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div id="appShell">
    <ul class="nav nav-tabs remote-tabs">
        <li class="nav-item">
            <a class="nav-link shell-menu list-tab active" route="list">
                <span class="remote-tab-title">会话列表</span>
            </a>
        </li>
    </ul>
    <div id="tabPanes">
        <div class="shell-tab-pane active show" route="list">
            <div id="sessionListView">
                <div class="session-list-toolbar">
                    <button type="button" class="btn btn-primary btn-sm" id="btnAddSession">添加会话</button>
                    <button type="button" class="btn btn-outline-light btn-sm" id="btnGlobalCommands">通用命令</button>
                </div>
                <div class="session-list-body">
                    <div id="sessionEmptyState" style="display: none;">
                        暂无会话，点击「添加会话」创建
                    </div>
                    <table class="table table-dark table-hover" id="sessionTable" style="display: none;">
                        <thead>
                        <tr>
                            <th>会话名称</th>
                            <th>IP</th>
                            <th>端口</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="sessionTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 行右键菜单 -->
<div id="sessionContextMenu">
    <a class="ctx-item" href="javascript:void(0)" data-action="copy">复制会话</a>
</div>

<!-- 添加 / 修改会话 -->
<div class="modal fade" id="sessionModal" tabindex="-1" aria-labelledby="sessionModalTitle" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="sessionModalTitle">添加会话</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="sessionForm" novalidate>
                    <input type="hidden" id="sessionId" value="">
                    <div class="mb-3">
                        <label for="sessionName" class="form-label">会话名称</label>
                        <input type="text" class="form-control" id="sessionName" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="sessionIp" class="form-label">IP 地址</label>
                        <input type="text" class="form-control" id="sessionIp" name="ip" value="127.0.0.1" required>
                    </div>
                    <div class="mb-3">
                        <label for="sessionPort" class="form-label">端口</label>
                        <input type="number" class="form-control" id="sessionPort" name="port" value="22" min="1" max="65535" required>
                    </div>
                    <div class="mb-3">
                        <label for="sessionUserName" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="sessionUserName" name="userName" required>
                    </div>
                    <div class="mb-3">
                        <label for="sessionPassword" class="form-label">密码</label>
                        <input type="password" class="form-control" id="sessionPassword" name="password" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="sessionSubmitBtn">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- 通用 / 会话常用命令 -->
<div class="modal fade" id="commandModal" tabindex="-1" aria-labelledby="commandModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="commandModalTitle">通用命令</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div id="commandSettingsBar" style="display:none" class="mb-3">
                    <div class="form-check form-check-inline">
                        <input type="checkbox" id="cmdAutoCollect" class="form-check-input">
                        <label for="cmdAutoCollect">自动收集</label>
                    </div>
                    <label class="ml-2">收集上限 <input type="number" id="cmdCollectLimit" min="1" max="1000" style="width:5em"></label>
                    <label class="ml-2">收集行数 <input type="number" id="cmdCollectLines" min="1" max="50" style="width:4em"></label>
                    <button type="button" class="btn btn-sm btn-outline-primary ml-2" id="cmdSettingsSaveBtn">保存设置</button>
                    <div class="small text-muted mt-1">回车后按行数写入本机常用命令；超上限删最旧；相同命令不重复新增。</div>
                </div>
                <div id="commandEmptyState" style="display: none;">暂无命令，请在下方添加</div>
                <table class="table table-sm table-hover" id="commandTable" style="display: none;">
                    <thead>
                    <tr>
                        <th style="width: 22%;">名称</th>
                        <th>命令内容</th>
                        <th style="width: 140px;">操作</th>
                    </tr>
                    </thead>
                    <tbody id="commandTableBody"></tbody>
                </table>
                <hr>
                <h6 id="commandFormTitle">添加命令</h6>
                <form id="commandForm" novalidate>
                    <input type="hidden" id="commandId" value="">
                    <div class="mb-3">
                        <label for="commandName" class="form-label">名称</label>
                        <input type="text" class="form-control" id="commandName" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="commandValue" class="form-label">命令内容</label>
                        <textarea class="form-control" id="commandValue" name="value" rows="3" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" id="commandResetBtn">重置表单</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-primary" id="commandSubmitBtn">添加</button>
            </div>
        </div>
    </div>
</div>

<div id="loadingIndicator">
    <p>连接中...</p>
</div>

<script src="../js/jquery-3.4.1.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/jquery-ui.js"></script>
<script src="../js/bootstrap/popper.min.js" charset="utf-8"></script>
<script src="../js/bootstrap/bootstrap.min.js" charset="utf-8"></script>
<script src="../js/index.js?v=6" charset="utf-8"></script>
<script src="../js/sessions.js?v=6" charset="utf-8"></script>
<script src="../js/commands-ui.js?v=1" charset="utf-8"></script>
<script src="../js/split-pane.js?v=1" charset="utf-8"></script>
<script>
    function loadSsh(query, route) {
        var q = query;
        if (q == null || q === '') {
            q = typeof window.workspaceIframeQuery === 'function'
                ? window.workspaceIframeQuery()
                : '';
        }
        var $pane = route
            ? $('.shell-tab-pane[route="' + route + '"]')
            : $('.shell-tab-pane.active.show.remote-pane');
        if (!$pane.length) {
            return;
        }
        $pane.find('.leftFrame').attr('src', 'sftp.html' + q);
        $pane.find('.rightFrame').attr('src', 'ssh.html' + q);
    }
    window.loadSsh = loadSsh;
</script>
</body>
</html>
