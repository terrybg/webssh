<!doctype html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Terry WebSSH</title>
    <!-- Bootstrap 的 CSS 文件 -->
    <link rel="stylesheet" href="../js/bootstrap/bootstrap.min.css"/>
    <link rel="stylesheet" href="../css/index.css"/>
    <link rel="shortcut icon" href="../image/logo.png" />
    <link rel="stylesheet" href="../iconfont/iconfont.css">
    <!-- 图标库： https://icons.bootcss.com/ -->
    <link rel="stylesheet" href="../font/bootstrap-icons.css">
    <link rel="stylesheet" href="../js/jquery-ui.css">
    <style>
        .shell-tab-pane>div{
            float: left;
            height: 100%;
        }
        .move-bar {
            background: #000;
            width: 10px;
            height: 100%;
            cursor: e-resize;
        }
        .leftDiv{
            min-width: 300px;
            max-width: calc(100% - 500px);
        }
        .resizable-iframe{
            width: 100%;
            height: 100%;
        }
        .shell-tab-pane iframe {
            border: 0px solid #ccc;
        }
        body{
            min-width: 800px;
        }
        #sessionListView {
            height: 100%;
            overflow: auto;
            color: #fff;
        }
        #sessionListView .nav-top {
            align-items: center;
            padding: 8px 16px;
        }
        #sessionListView .nav-top .btn {
            margin-right: 8px;
        }
        #sessionListView .session-list-body {
            padding: 16px 20px 24px;
        }
        #sessionEmptyState {
            padding: 48px 16px;
            text-align: center;
            color: #adb5bd;
        }
        #sessionTable .session-actions .btn {
            margin: 2px 2px;
        }
        #workspaceView {
            height: 100%;
        }
        #loadingIndicator {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            text-align: center;
            padding-top: 40vh;
        }
        #commandModal .command-value {
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 0.875rem;
        }
        #commandModal .command-actions .btn {
            margin: 2px 2px;
        }
        #commandEmptyState {
            padding: 16px 8px;
            text-align: center;
            color: #6c757d;
        }
    </style>
</head>
<body>
<!-- 会话列表（默认首页） -->
<div id="sessionListView">
    <div class="row bg-dark nav-top m-0">
        <div class="col-sm d-flex align-items-center">
            <button type="button" class="btn btn-primary btn-sm" id="btnAddSession">添加会话</button>
            <button type="button" class="btn btn-outline-light btn-sm" id="btnGlobalCommands">通用命令</button>
        </div>
    </div>
    <div class="session-list-body">
        <div id="sessionEmptyState" style="display: none;">
            暂无会话，点击「添加会话」创建
        </div>
        <table class="table table-dark table-hover" id="sessionTable" style="display: none;">
            <thead>
            <tr>
                <th>会话名称</th>
                <th>IP</th>
                <th>端口</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="sessionTableBody"></tbody>
        </table>
    </div>
</div>

<!-- 远程工作区（Task 5 切换显示；默认隐藏） -->
<div id="workspaceView" style="display: none;">
    <!-- 导航 -->
    <div class="row bg-dark nav-top m-0">
        <div class="col-sm d-flex align-items-center">
            <button type="button" class="btn btn-outline-light btn-sm" id="btnBackToSessions">返回会话列表</button>
            <ul class="nav mr-auto"></ul>
        </div>
        <div class="col-sm">
        </div>
    </div>
    <div class="tab-content" style="height: calc(100% - 0px);">
        <div class="tab-pane fade active show top-tab-pane" route="remote-shell">
            <ul class="nav nav-tabs remote-tabs">
                <li class="nav-item">
                    <a class="nav-link shell-menu active" route="1">
                        <span class="iconfont icon-cloudshellyunminglinghang"></span>
                        <span class="remote-tab-title">会话</span>
                        <span class="iconfont icon-shanchu2 m-lg-2 shell-remove"></span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link shell-add">
                        <span class="iconfont icon-tianjia"></span>新建会话
                    </a>
                </li>
            </ul>
            <div class="tab-pane fade active show shell-tab-pane" route="1" style="height: calc(100% - 40px)">
                <div class="leftDiv" style="width: 30%">
                    <iframe class="resizable-iframe leftFrame" src=""></iframe>
                </div>
                <div class="move-bar"></div>
                <div class="rightDiv" style="width: calc(70% - 10px)">
                    <iframe class="resizable-iframe rightFrame" src=""></iframe>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 添加 / 修改会话 -->
<div class="modal fade" id="sessionModal" tabindex="-1" aria-labelledby="sessionModalTitle" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="sessionModalTitle">添加会话</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="sessionForm" novalidate>
                    <input type="hidden" id="sessionId" value="">
                    <div class="mb-3">
                        <label for="sessionName" class="form-label">会话名称</label>
                        <input type="text" class="form-control" id="sessionName" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="sessionIp" class="form-label">IP 地址</label>
                        <input type="text" class="form-control" id="sessionIp" name="ip" value="127.0.0.1" required>
                    </div>
                    <div class="mb-3">
                        <label for="sessionPort" class="form-label">端口</label>
                        <input type="number" class="form-control" id="sessionPort" name="port" value="22" min="1" max="65535" required>
                    </div>
                    <div class="mb-3">
                        <label for="sessionUserName" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="sessionUserName" name="userName" required>
                    </div>
                    <div class="mb-3">
                        <label for="sessionPassword" class="form-label">密码</label>
                        <input type="password" class="form-control" id="sessionPassword" name="password" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="sessionSubmitBtn">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- 通用 / 会话常用命令 -->
<div class="modal fade" id="commandModal" tabindex="-1" aria-labelledby="commandModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="commandModalTitle">通用命令</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div id="commandEmptyState" style="display: none;">暂无命令，请在下方添加</div>
                <table class="table table-sm table-hover" id="commandTable" style="display: none;">
                    <thead>
                    <tr>
                        <th style="width: 22%;">名称</th>
                        <th>命令内容</th>
                        <th style="width: 140px;">操作</th>
                    </tr>
                    </thead>
                    <tbody id="commandTableBody"></tbody>
                </table>
                <hr>
                <h6 id="commandFormTitle">添加命令</h6>
                <form id="commandForm" novalidate>
                    <input type="hidden" id="commandId" value="">
                    <div class="mb-3">
                        <label for="commandName" class="form-label">名称</label>
                        <input type="text" class="form-control" id="commandName" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="commandValue" class="form-label">命令内容</label>
                        <textarea class="form-control" id="commandValue" name="value" rows="3" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" id="commandResetBtn">重置表单</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-primary" id="commandSubmitBtn">添加</button>
            </div>
        </div>
    </div>
</div>

<!-- 全局加载（Task 5 远程连接可用） -->
<div id="loadingIndicator">
    <p>连接中...</p>
</div>

<script src="../js/common.js"></script>
<script src="../js/jquery-3.4.1.min.js"></script>
<script src="../js/jquery-ui.js"></script>
<script src="../js/bootstrap/popper.min.js" charset="utf-8"></script>
<script src="../js/bootstrap/bootstrap.min.js" charset="utf-8"></script>
<script src="../js/index.js" charset="utf-8"></script>
<script src="../js/sessions.js" charset="utf-8"></script>
<script src="../js/commands-ui.js" charset="utf-8"></script>
<script>
    // Document-level resize-bar handlers bind once (not inside loadSsh) so
    // 远程→返回→远程 does not stack mousemove/mousedown/mouseup listeners.
    var moveFlag = false;
    $(document).on('mousedown.movebar', function(e) {
        var $bar = $(".tab-pane.show .move-bar");
        if (!$bar.length || !$(e.target).offset()) {
            return;
        }
        // 当鼠标点击到拖动条上时,移动鼠标即可拖拽
        var left = $(e.target).offset().left - $bar.offset().left;
        if (left == 0) {
            moveFlag = true;
        }
    });
    $(document).on('mouseup.movebar', function() {
        moveFlag = false;
    });
    $(document).on('mousemove.movebar', function(e) {
        if (moveFlag) {
            reloadIframeWidth(e.pageX);
        }
        return false;
    });

    function loadSsh(query){
        var q = query;
        if (q == null || q === '') {
            q = typeof window.workspaceIframeQuery === 'function'
                ? window.workspaceIframeQuery()
                : '';
        }
        var leftDeferred = $.Deferred();
        var rightDeferred = $.Deferred();
        $('.tab-pane.show .leftFrame').attr('src', 'sftp.html' + q).one('load', function() {
            leftDeferred.resolve();
        });
        $('.tab-pane.show .rightFrame').attr('src', 'ssh.html' + q).one('load', function() {
            rightDeferred.resolve();
        });
        // iframe documents are new each connect; rebind mouseup so drag ends over panes
        $.when(leftDeferred, rightDeferred).done(function() {
            $(".tab-pane.show .leftFrame,.tab-pane.show .rightFrame").contents()
                .off('mouseup.movebar')
                .on('mouseup.movebar', function() {
                    moveFlag = false;
                });
        });
    }
    reloadIframeWidth($(window).width() / 100 * 30);
    window.onresize = function(){
        reloadIframeWidth($(".tab-pane.show .leftDiv").width());
    }
    function reloadIframeWidth(leftWidth){
        var clientWidth = $(window).width();
        var minWidth = 300, maxMathWidth = 500, moveWidth = 10;
        // 最小宽
        if(leftWidth < minWidth){
            leftWidth = minWidth;//按钮+标题栏+分页栏高度
        }
        // 最大宽
        var maxWidth = $(window).width() - maxMathWidth;
        if(leftWidth > maxWidth){
            leftWidth = maxWidth;
        }
        $(".tab-pane.show .leftDiv").width(leftWidth);
        var rightWidth = "calc(100% - " + leftWidth + "px - " + moveWidth + "px)";
        $(".tab-pane.show .rightDiv").width(rightWidth);
    }
</script>
</body>
</html>
