<!doctype html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Remote Shell</title>
    <link rel="stylesheet" href="../css/xterm2.css" />
    <link rel="stylesheet" href="../js/bootstrap/bootstrap.min.css"/>
    <link rel="stylesheet" href="../iconfont/iconfont.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body.ssh-app {
            display: flex;
            flex-direction: column;
            background: #0c0c0c;
            overflow: hidden;
            color: #ddd;
        }
        .bg-dark { color: #FFF; }
        #load .modal-content { background: #000; color: #FFF; }

        /* Windows 风格：工具栏固定顶栏，终端占满剩余区域 */
        .ssh-toolbar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            padding: 4px 10px;
            background: linear-gradient(180deg, #2d2d2d 0%, #252525 100%);
            border-bottom: 1px solid #3a3a3a;
            box-shadow: 0 1px 0 rgba(255,255,255,.04) inset;
            z-index: 100;
            font-size: 12px;
            color: #cfcfcf;
            user-select: none;
        }
        .ssh-toolbar .btn-group > .btn,
        .ssh-toolbar > .btn,
        .ssh-toolbar > a.btn {
            background: #3a3a3a;
            border-color: #4a4a4a;
            color: #eee;
            font-size: 12px;
            padding: 3px 10px;
            line-height: 1.4;
        }
        .ssh-toolbar .btn:hover,
        .ssh-toolbar a.btn:hover {
            background: #4a4a4a;
            border-color: #5a5a5a;
            color: #fff;
        }
        .ssh-toolbar .btn:focus,
        .ssh-toolbar a.btn:focus {
            box-shadow: none;
        }
        .ssh-toolbar .dropdown-menu {
            font-size: 12px;
            background: #2b2b2b;
            border-color: #4a4a4a;
        }
        .ssh-toolbar .dropdown-item {
            color: #ddd;
            cursor: pointer;
        }
        .ssh-toolbar .dropdown-item:hover {
            background: #0d6efd;
            color: #fff;
        }
        .ssh-toolbar .iconfont {
            font-size: 14px;
        }
        .ssh-toolbar-spacer {
            flex: 1 1 auto;
            min-width: 8px;
        }
        .ssh-toolbar-hint {
            color: #888;
            font-size: 11px;
            white-space: nowrap;
        }

        .ssh-shortcut-panel {
            flex: 0 0 auto;
            max-height: min(280px, 40vh);
            overflow: hidden;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
        }
        .ssh-shortcut-panel .card {
            border: 0;
            border-radius: 0;
            background: transparent;
        }
        .ssh-shortcut-panel .card-body {
            padding: 8px 10px;
            max-height: min(280px, 40vh);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .ssh-shortcut-filters {
            display: flex;
            gap: 8px;
            flex: 0 0 auto;
            margin-bottom: 8px;
        }
        .ssh-shortcut-filters .form-control {
            background: #111;
            border-color: #444;
            color: #eee;
        }
        #shortcut {
            overflow-y: auto;
            flex: 1 1 auto;
            min-height: 0;
            max-height: none;
            margin-bottom: 0;
        }
        #shortcut .list-group-item {
            border-color: #333;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        #shortcut .list-group-item:hover {
            background: #2a3a4a !important;
        }

        #terminal.ssh-terminal {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            height: auto;
            overflow: hidden;
            position: relative;
            background: #000;
        }
        #terminal.ssh-terminal .xterm {
            width: 100%;
            height: 100%;
            padding: 2px 0 0 2px;
            box-sizing: border-box;
        }
        .ssh-find-bar {
            display: none;
            position: fixed;
            top: 44px;
            right: 16px;
            z-index: 400;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            background: #2b2b2b;
            border: 1px solid #555;
            border-radius: 4px;
            box-shadow: 0 6px 18px rgba(0,0,0,.45);
            font-size: 12px;
            color: #eee;
        }
        .ssh-find-bar input {
            width: 180px;
            height: 26px;
            border: 1px solid #555;
            background: #1a1a1a;
            color: #eee;
            border-radius: 3px;
            padding: 0 8px;
        }
        .ssh-find-bar input:focus { outline: 1px solid #0d6efd; }
        .ssh-find-bar button {
            height: 26px;
            min-width: 26px;
            border: 1px solid #555;
            background: #3a3a3a;
            color: #eee;
            border-radius: 3px;
            cursor: pointer;
            padding: 0 8px;
        }
        .ssh-find-bar button:hover { background: #4a4a4a; }
        .ssh-find-bar .ssh-find-status {
            min-width: 4.5em;
            color: #bbb;
            font-variant-numeric: tabular-nums;
        }
        .ssh-find-bar.no-hit input {
            border-color: #e74c3c;
        }
        .ssh-finding .xterm-selection,
        .ssh-finding .xterm .xterm-selection,
        .ssh-finding .xterm-selection div,
        .ssh-finding .xterm .xterm-selection div {
            background: #ffcc00 !important;
            background-color: #ffcc00 !important;
            opacity: 0.85 !important;
            outline: 2px solid #ff6600;
        }
        #terminal.ssh-terminal .xterm-viewport {
            width: 100% !important;
        }

        .tool-list > div:hover { color: rgb(60,126,255); }
        .tool-title { font-size: 16px; color: rgba(255,255,255,0.9); }
        .iconfont { font-size: 16px; }
        .tool-item {
            cursor: pointer;
            display: inline-block;
            width: 42px;
            height: 42px;
            margin-bottom: 4px;
            line-height: 42px;
            border-radius: 4px;
            background-color: #000;
        }
        /* 整个滚动条 */
        /*::-webkit-scrollbar {width : 10px;}
        !* 滚动条里面滑块 *!
        ::-webkit-scrollbar-thumb {border-radius: 10px;background: #eee;}
        !*滚动条里面轨道*!
        ::-webkit-scrollbar-track {border-radius: 10px;box-shadow: inset 0 0 1px rgba(0, 0, 0, 0.2);background: #000;}*/

        ::-webkit-scrollbar {width : 7px;}
        /*!* 滚动条里面滑块 *!*/
        ::-webkit-scrollbar-thumb {border-radius: 7px;background: #3f3f3f;}
        /*!*滚动条里面轨道*!*/
        ::-webkit-scrollbar-track {border-radius: 7px;box-shadow: inset 0 0 1px rgba(0, 0, 0, 0.2);background: #000;}

        .cmd-suggest {
            position: fixed;
            left: 12px;
            top: 0;
            z-index: 200;
            max-width: min(640px, 80vw);
            max-height: 240px;
            overflow-y: auto;
            background: rgba(28, 28, 28, 0.96);
            border: 1px solid #444;
            border-radius: 4px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            color: #ddd;
            font-size: 12px;
            font-family: Consolas, Monaco, monospace;
            pointer-events: auto;
        }
        .cmd-suggest ul {
            list-style: none;
            margin: 0;
            padding: 4px 0;
        }
        .cmd-suggest li {
            padding: 6px 12px;
            cursor: pointer;
            overflow: hidden;
        }
        /* 悬浮略暗；↑↓ 选中更亮 */
        .cmd-suggest li:hover {
            background: #1a2838;
        }
        .cmd-suggest li.active {
            background: #2a4a7a;
        }
        .cmd-suggest li.active:hover {
            background: #2a4a7a;
        }
        .cmd-suggest .cmd-row {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            min-width: 0;
        }
        /* 固定占位，通用/本机命令左对齐 */
        .cmd-suggest .cmd-src {
            flex: 0 0 14px;
            width: 14px;
            height: 14px;
            margin-top: 2px;
            color: #8ab4f8;
        }
        .cmd-suggest .cmd-src svg {
            display: block;
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
        .cmd-suggest li.active .cmd-src {
            color: #b8d0f8;
        }
        .cmd-suggest .cmd-body {
            flex: 1;
            min-width: 0;
        }
        /* 命令在上：主样式 */
        .cmd-suggest .cmd-val {
            color: #ececec;
            font-size: 13px;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cmd-suggest li:hover .cmd-val {
            color: #f2f2f2;
        }
        .cmd-suggest li.active .cmd-val {
            color: #fff;
        }
        /* 中文名在下：次样式 */
        .cmd-suggest .cmd-name {
            color: #8a8a8a;
            font-size: 11px;
            margin-top: 2px;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cmd-suggest li:hover .cmd-name {
            color: #9aa6b4;
        }
        .cmd-suggest li.active .cmd-name {
            color: #c8d4e8;
        }
        /* 输入匹配片段高亮 */
        .cmd-suggest .cmd-match {
            color: #e6b450;
            background: transparent;
            font-weight: 700;
            padding: 0;
        }
        .cmd-suggest li:hover .cmd-match {
            color: #d4a43c;
        }
        .cmd-suggest li.active .cmd-match {
            color: #ffd666;
        }
        body.ssh-drop-target {
            outline: 2px dashed #0d6efd;
            outline-offset: -4px;
        }
        #sshDropToast {
            position: fixed;
            left: 50%;
            bottom: 72px;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.82);
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #sshDropToast.show {
            opacity: 1;
        }
        #sshConflictModal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(0,0,0,.45);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #sshConflictModal.show {
            display: flex;
        }
        .ssh-conflict-box {
            width: min(420px, 92vw);
            background: #1e1e1e;
            color: #eee;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 14px 16px;
            box-shadow: 0 8px 28px rgba(0,0,0,.4);
        }
        .ssh-conflict-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .ssh-conflict-msg {
            font-size: 13px;
            margin-bottom: 10px;
            color: #ccc;
        }
        .ssh-conflict-label {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
        }
        #sshConflictRename {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
            padding: 6px 8px;
            border: 1px solid #555;
            border-radius: 4px;
            background: #111;
            color: #fff;
        }
        .ssh-conflict-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .ssh-conflict-actions button {
            border: 0;
            border-radius: 4px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
        }
        #sshConflictBtnRename { background: #0d6efd; color: #fff; }
        #sshConflictBtnReplace { background: #d97706; color: #fff; }
        #sshConflictBtnSkip { background: #555; color: #fff; }
    </style>
</head>
<body class="ssh-app"><!-- 对话框 -->
<!-- 使用自带的aria-labelledby事件按钮会冲突 -->
<div class="modal fade" id="stationModel" tabindex="-1"  data-backdrop="static" data-keyboard="false" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content bg-dark">
            <div class="modal-header">
                <h5 class="modal-title">连接列表</h5>
            </div>
            <div class="modal-body">
                <button type="button" class="btn btn-primary my-2">新增连接</button>
                <table class="table table-hover table-dark">
                    <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">站点ID</th>
                        <th scope="col">站点名称</th>
                        <th scope="col">最近上线时间</th>
                        <th scope="col">连接状态</th>
                        <th scope="col">站点连接人数（同个站点同时只能10人连接）</th>
                    </tr>
                    </thead>
                    <tbody style="cursor: pointer;"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<!-- 对话框 -->
<div class="modal fade" id="load" tabindex="-1" data-backdrop="static" data-keyboard="false" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
            <div class="text-center">
                <div class="spinner-border text-light" style="width: 3rem; height: 3rem;" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
                <div><span class="navbar-brand mb-0 h1">上传中...</span></div>
            </div>
        </div>
    </div>
</div>
<header class="ssh-toolbar" role="toolbar" aria-label="终端工具栏">
    <div class="btn-group" role="group" aria-label="连接与编码">
        <button type="button" onclick="reload()" class="btn btn-secondary" title="刷新连接">
            <span class="iconfont icon-shuaxin"></span>
        </button>
        <div class="btn-group" role="group" title="切换编码">
            <button type="button" class="btn btn-secondary dropdown-toggle linux-encode" data-toggle="dropdown" aria-expanded="false">
                UTF-8
            </button>
            <div class="dropdown-menu">
                <div class="dropdown-item" onclick="setEncode('UTF-8')">UTF-8</div>
                <div class="dropdown-item" onclick="setEncode('GBK')">GBK</div>
            </div>
        </div>
    </div>
    <!-- v1 desktop: open files from desktop icon menu, not SSH toolbar -->
    <button type="button" id="btnToggleFiles" class="btn btn-secondary" style="display:none" aria-hidden="true" title="显示/隐藏左侧文件模块" onclick="toggleFilesModule()">
        文件
    </button>
    <a class="btn btn-secondary" data-toggle="collapse" href="#collapseExample" role="button" aria-expanded="false" aria-controls="collapseExample" title="命令快捷键">
        快捷键
    </a>
    <div class="btn-group" role="group" title="切换主题">
        <button type="button" class="btn btn-secondary dropdown-toggle" data-toggle="dropdown" aria-expanded="false">
            主题
        </button>
        <div class="dropdown-menu dropdown-menu-right">
            <div class="dropdown-item" onclick="setTheme('dark')">暗黑</div>
            <div class="dropdown-item" onclick="setTheme('blue')">深蓝</div>
            <div class="dropdown-item" onclick="setTheme('white')">白色</div>
            <div class="dropdown-item" onclick="setTheme('green')">绿色</div>
        </div>
    </div>
    <div class="ssh-toolbar-spacer"></div>
    <span class="ssh-toolbar-hint">Ctrl+F 查找会话内容</span>
</header>
<div class="collapse ssh-shortcut-panel" id="collapseExample">
    <div class="card card-body bg-dark">
        <div class="ssh-shortcut-filters">
            <input id="shortcutSearch" class="form-control form-control-sm" placeholder="搜索命令" style="flex:1 1 auto;min-width:0">
            <select id="shortcutFilter" class="form-control form-control-sm" style="flex:0 0 120px">
              <option value="all">全部</option>
              <option value="global">通用命令</option>
              <option value="session">本机常用</option>
            </select>
        </div>
        <ul class="list-group" id="shortcut"></ul>
    </div>
</div>
<div id="terminal" class="ssh-terminal"></div>
<div id="sshFindBar" class="ssh-find-bar" role="search">
    <input id="sshFindInput" type="text" placeholder="在会话中查找" autocomplete="off">
    <span class="ssh-find-status" id="sshFindStatus"></span>
    <button type="button" id="sshFindPrev" title="上一个（Shift+Enter / Shift+F3）">↑</button>
    <button type="button" id="sshFindNext" title="下一个（Enter / F3）">↓</button>
    <button type="button" id="sshFindClose" title="关闭（Esc）">×</button>
</div>
<div id="cmdSuggest" class="cmd-suggest" style="display:none">
  <ul id="cmdSuggestList"></ul>
</div>
<div id="sshConflictModal" style="display:none">
  <div class="ssh-conflict-box">
    <div class="ssh-conflict-title">目标已包含同名文件</div>
    <div class="ssh-conflict-msg" id="sshConflictMsg"></div>
    <label class="ssh-conflict-label" for="sshConflictRename">重命名为</label>
    <input id="sshConflictRename" type="text" autocomplete="off">
    <div class="ssh-conflict-actions">
      <button type="button" id="sshConflictBtnRename">重命名</button>
      <button type="button" id="sshConflictBtnReplace">替换</button>
      <button type="button" id="sshConflictBtnSkip">放弃上传</button>
    </div>
  </div>
</div>
<script src="../js/jquery-3.4.1.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/xterm2.js" charset="utf-8"></script>
<script src="../js/xterm-addon-fit.js" charset="utf-8"></script>
<script src="../js/bootstrap/popper.min.js" charset="utf-8"></script>
<script src="../js/bootstrap/bootstrap.min.js" charset="utf-8"></script>
<script src="../js/websocket.js" charset="utf-8"></script>
<script src="../js/cmd-suggest.js?v=7" charset="utf-8"></script>
<script src="../js/ssh.js?v=23" charset="utf-8"></script>
</body>
</html>
