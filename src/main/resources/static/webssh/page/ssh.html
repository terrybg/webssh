<!doctype html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Remote Shell</title>
    <link rel="stylesheet" href="../css/xterm2.css" />
    <link rel="stylesheet" href="../js/bootstrap/bootstrap.min.css"/>
    <link rel="stylesheet" href="../iconfont/iconfont.css">
    <style>
        /*body{position: relative;background-color: #000}*/
        html{height: 100%;}
        body{height: 100%;background: #000;overflow: hidden;}
        .bg-dark{color: #FFF}
        #load .modal-content{background: #000;color: #FFF}
        .tools{
            position: absolute;
            top: 20px;
            right: 30px;
            z-index:100;
            width: 410px;
            padding: 20px;
            /*backdrop-filter: blur(5px);*/
            background-color: rgba(255, 255, 255, 0.1);
        }
        .tools{font-size: 12px;color: rgb(197,197,197)}
        .tool-list > div:hover{color:rgb(60,126,255)}
        .tool-title{font-size: 16px;color: rgba(255,255,255,0.9);}
        .iconfont{    font-size: 16px;}
        .tool-item{cursor: pointer;
            display: inline-block;
            width: 42px;
            height: 42px;
            margin-bottom: 4px;
            line-height: 42px;
            border-radius: 4px;
            background-color: #000;}
        #shortcut{overflow-y: scroll;height: 300px}
        /* 整个滚动条 */
        /*::-webkit-scrollbar {width : 10px;}
        !* 滚动条里面滑块 *!
        ::-webkit-scrollbar-thumb {border-radius: 10px;background: #eee;}
        !*滚动条里面轨道*!
        ::-webkit-scrollbar-track {border-radius: 10px;box-shadow: inset 0 0 1px rgba(0, 0, 0, 0.2);background: #000;}*/

        ::-webkit-scrollbar {width : 7px;}
        /*!* 滚动条里面滑块 *!*/
        ::-webkit-scrollbar-thumb {border-radius: 7px;background: #3f3f3f;}
        /*!*滚动条里面轨道*!*/
        ::-webkit-scrollbar-track {border-radius: 7px;box-shadow: inset 0 0 1px rgba(0, 0, 0, 0.2);background: #000;}

        .cmd-suggest {
            position: fixed;
            left: 12px;
            top: 0;
            z-index: 200;
            max-width: min(640px, 80vw);
            max-height: 240px;
            overflow-y: auto;
            background: rgba(28, 28, 28, 0.96);
            border: 1px solid #444;
            border-radius: 4px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            color: #ddd;
            font-size: 12px;
            font-family: Consolas, Monaco, monospace;
            pointer-events: auto;
        }
        .cmd-suggest ul {
            list-style: none;
            margin: 0;
            padding: 4px 0;
        }
        .cmd-suggest li {
            padding: 6px 12px;
            cursor: pointer;
            overflow: hidden;
        }
        /* 悬浮略暗；↑↓ 选中更亮 */
        .cmd-suggest li:hover {
            background: #1a2838;
        }
        .cmd-suggest li.active {
            background: #2a4a7a;
        }
        .cmd-suggest li.active:hover {
            background: #2a4a7a;
        }
        .cmd-suggest .cmd-row {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            min-width: 0;
        }
        /* 固定占位，通用/本机命令左对齐 */
        .cmd-suggest .cmd-src {
            flex: 0 0 14px;
            width: 14px;
            height: 14px;
            margin-top: 2px;
            color: #8ab4f8;
        }
        .cmd-suggest .cmd-src svg {
            display: block;
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
        .cmd-suggest li.active .cmd-src {
            color: #b8d0f8;
        }
        .cmd-suggest .cmd-body {
            flex: 1;
            min-width: 0;
        }
        /* 命令在上：主样式 */
        .cmd-suggest .cmd-val {
            color: #ececec;
            font-size: 13px;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cmd-suggest li:hover .cmd-val {
            color: #f2f2f2;
        }
        .cmd-suggest li.active .cmd-val {
            color: #fff;
        }
        /* 中文名在下：次样式 */
        .cmd-suggest .cmd-name {
            color: #8a8a8a;
            font-size: 11px;
            margin-top: 2px;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cmd-suggest li:hover .cmd-name {
            color: #9aa6b4;
        }
        .cmd-suggest li.active .cmd-name {
            color: #c8d4e8;
        }
        /* 输入匹配片段高亮 */
        .cmd-suggest .cmd-match {
            color: #e6b450;
            background: transparent;
            font-weight: 700;
            padding: 0;
        }
        .cmd-suggest li:hover .cmd-match {
            color: #d4a43c;
        }
        .cmd-suggest li.active .cmd-match {
            color: #ffd666;
        }
        body.ssh-drop-target {
            outline: 2px dashed #0d6efd;
            outline-offset: -4px;
        }
        #sshDropToast {
            position: fixed;
            left: 50%;
            bottom: 72px;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.82);
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #sshDropToast.show {
            opacity: 1;
        }
        #sshConflictModal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(0,0,0,.45);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #sshConflictModal.show {
            display: flex;
        }
        .ssh-conflict-box {
            width: min(420px, 92vw);
            background: #1e1e1e;
            color: #eee;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 14px 16px;
            box-shadow: 0 8px 28px rgba(0,0,0,.4);
        }
        .ssh-conflict-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .ssh-conflict-msg {
            font-size: 13px;
            margin-bottom: 10px;
            color: #ccc;
        }
        .ssh-conflict-label {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
        }
        #sshConflictRename {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
            padding: 6px 8px;
            border: 1px solid #555;
            border-radius: 4px;
            background: #111;
            color: #fff;
        }
        .ssh-conflict-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .ssh-conflict-actions button {
            border: 0;
            border-radius: 4px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
        }
        #sshConflictBtnRename { background: #0d6efd; color: #fff; }
        #sshConflictBtnReplace { background: #d97706; color: #fff; }
        #sshConflictBtnSkip { background: #555; color: #fff; }
    </style>
</head>
<body><!-- 对话框 -->
<!-- 使用自带的aria-labelledby事件按钮会冲突 -->
<div class="modal fade" id="stationModel" tabindex="-1"  data-backdrop="static" data-keyboard="false" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content bg-dark">
            <div class="modal-header">
                <h5 class="modal-title">连接列表</h5>
            </div>
            <div class="modal-body">
                <button type="button" class="btn btn-primary my-2">新增连接</button>
                <table class="table table-hover table-dark">
                    <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">站点ID</th>
                        <th scope="col">站点名称</th>
                        <th scope="col">最近上线时间</th>
                        <th scope="col">连接状态</th>
                        <th scope="col">站点连接人数（同个站点同时只能10人连接）</th>
                    </tr>
                    </thead>
                    <tbody style="cursor: pointer;"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<!-- 对话框 -->
<div class="modal fade" id="load" tabindex="-1" data-backdrop="static" data-keyboard="false" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
            <div class="text-center">
                <div class="spinner-border text-light" style="width: 3rem; height: 3rem;" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
                <div><span class="navbar-brand mb-0 h1">上传中...</span></div>
            </div>
        </div>
    </div>
</div>
<div id="terminal" style="width: 100%;height: 100%;"></div>
<div id="cmdSuggest" class="cmd-suggest" style="display:none">
  <ul id="cmdSuggestList"></ul>
</div>
<div class="tools">
    <div class="btn-group" role="group" aria-label="Button group with nested dropdown">
        <button type="button" onclick="reload()" class="btn btn-secondary" title="刷新连接"><span class="iconfont icon-shuaxin"></span></button>
        <div class="btn-group" role="group"  title="切换编码">
            <button type="button" class="btn btn-secondary dropdown-toggle linux-encode" data-toggle="dropdown" aria-expanded="false">
                UTF-8
            </button>
            <div class="dropdown-menu">
                <div class="dropdown-item" onclick="setEncode('UTF-8')">UTF-8</div>
                <div class="dropdown-item" onclick="setEncode('GBK')">GBK</div>
            </div>
        </div>
        <!-- v1 desktop: open files from desktop icon menu, not SSH toolbar -->
        <button type="button" id="btnToggleFiles" class="btn btn-secondary" style="display:none" aria-hidden="true" title="显示/隐藏左侧文件模块" onclick="toggleFilesModule()">
            文件
        </button>
        <a class="btn btn-secondary" data-toggle="collapse" href="#collapseExample" role="button" aria-expanded="false" aria-controls="collapseExample">
            快捷键
        </a>
        <div class="btn-group" role="group"  title="切换主题">
            <button type="button" class="btn btn-secondary dropdown-toggle linux-encode" data-toggle="dropdown" aria-expanded="false">
                切换主题
            </button>
            <div class="dropdown-menu">
                <div class="dropdown-item" onclick="setTheme('dark')">暗黑</div>
                <div class="dropdown-item" onclick="setTheme('blue')">深蓝</div>
                <div class="dropdown-item" onclick="setTheme('white')">白色</div>
                <div class="dropdown-item" onclick="setTheme('green')">绿色</div>
            </div>
        </div>
        <button type="button" onclick="logout()" class="btn btn-secondary">注销</button>
    </div>
    <div class="collapse" id="collapseExample">
        <div class="card card-body bg-dark">
            <input id="shortcutSearch" class="form-control form-control-sm mb-2" placeholder="搜索命令">
            <select id="shortcutFilter" class="form-control form-control-sm mb-2">
              <option value="all">全部</option>
              <option value="global">通用命令</option>
              <option value="session">本机常用</option>
            </select>
            <ul class="list-group" id="shortcut"></ul>
        </div>
    </div>
</div>
<div id="sshConflictModal" style="display:none">
  <div class="ssh-conflict-box">
    <div class="ssh-conflict-title">目标已包含同名文件</div>
    <div class="ssh-conflict-msg" id="sshConflictMsg"></div>
    <label class="ssh-conflict-label" for="sshConflictRename">重命名为</label>
    <input id="sshConflictRename" type="text" autocomplete="off">
    <div class="ssh-conflict-actions">
      <button type="button" id="sshConflictBtnRename">重命名</button>
      <button type="button" id="sshConflictBtnReplace">替换</button>
      <button type="button" id="sshConflictBtnSkip">放弃上传</button>
    </div>
  </div>
</div>
<script src="../js/jquery-3.4.1.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/xterm2.js" charset="utf-8"></script>
<script src="../js/xterm-addon-fit.js" charset="utf-8"></script>
<script src="../js/bootstrap/popper.min.js" charset="utf-8"></script>
<script src="../js/bootstrap/bootstrap.min.js" charset="utf-8"></script>
<script src="../js/websocket.js" charset="utf-8"></script>
<script src="../js/cmd-suggest.js?v=7" charset="utf-8"></script>
<script src="../js/ssh.js?v=10" charset="utf-8"></script>
</body>
</html>
